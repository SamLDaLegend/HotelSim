<!doctype html>
<!--
  G-017 replay viewer. Disposable (ADR-0013 §1). Not the renderer, not apps/game.
  It reads recorded frames from a completed run. There is no simulation on this page
  and nothing to send a command to.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>HotelSim replay</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; background: #14161a; color: #d8dbe0;
        font: 13px/1.45 ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
      }
      header { padding: 8px 12px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
      #stage { display: flex; gap: 12px; padding: 0 12px; align-items: flex-start; }
      canvas { background: #0d0f12; border: 1px solid #2a2f38; }
      #side { width: 320px; flex: none; }
      .panel { border: 1px solid #2a2f38; padding: 8px; margin-bottom: 8px; }
      .panel h2 { font-size: 12px; margin: 0 0 6px; color: #8b93a1; font-weight: 600; letter-spacing: .06em; }
      table { border-collapse: collapse; width: 100%; }
      td { padding: 1px 4px 1px 0; }
      td.n { text-align: right; font-variant-numeric: tabular-nums; }
      .sw { display: inline-block; width: 10px; height: 10px; margin-right: 6px; border: 1px solid #000; vertical-align: -1px; }
      #transport { padding: 8px 12px; display: flex; gap: 10px; align-items: center; }
      #scrub { flex: 1; }
      button { background: #232833; color: #d8dbe0; border: 1px solid #3a4150; padding: 3px 9px; font: inherit; cursor: pointer; }
      button.on { background: #3c5a8a; border-color: #5b82c0; }
      #clock { font-size: 15px; color: #fff; }
      #warn { color: #e0a03a; }
    </style>
  </head>
  <body>
    <header>
      <input type="file" id="file" accept=".ndjson,.jsonl,.json,.txt" />
      <span id="status">no recording loaded</span>
      <span id="warn"></span>
    </header>

    <div id="transport">
      <button id="play">play</button>
      <span>ticks/s</span>
      <span id="speeds"></span>
      <input type="range" id="scrub" min="0" max="0" value="0" step="1" disabled />
      <span id="clock">—</span>
    </div>

    <div id="stage">
      <canvas id="view" width="1180" height="640"></canvas>
      <div id="side">
        <div class="panel"><h2>HOTEL</h2><div id="hud"></div></div>
        <div class="panel"><h2>NEEDS AT DEPARTURE</h2><div id="needs"></div></div>
        <div class="panel"><h2>LEGEND</h2><div id="legend"></div></div>
      </div>
    </div>

    <script type="module" src="viewer.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HotelSim</title>
    <style>
      /* Placeholder art (ADR-0014): flat colour, clear silhouettes, no assets. Everything
         in the building is drawn by Pixi; this stylesheet only lays out the page chrome. */
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0d0f12;
        color: #c8cfda;
        font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        overflow: hidden;
      }
      /* THREE ROWS, AND THE MIDDLE ONE IS THE ONLY ONE THAT YIELDS (E-013, G-048).
         `1fr` with `min-height: 0` on #stage means the picture gives up its height so the
         chrome keeps its own. Every CONTROL now lives in the first row, so a control's
         distance from the top of the page is bounded by the controls above it and by
         nothing else — in particular not by how tall the viewport happens to be. */
      #app {
        display: grid;
        grid-template-rows: auto 1fr auto;
        height: 100%;
      }
      #hud,
      #tools,
      #floors,
      #transport {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 18px;
        align-items: center;
        padding: 6px 10px;
        background: #14181f;
        border-bottom: 1px solid #232833;
      }
      #stage {
        position: relative;
        min-height: 0;
      }
      #stage canvas {
        display: block;
      }
      /* THE REVIEW FEED SITS ON THE PICTURE, NOT IN THE CHROME (G-066b, E-013).
         E-013 is an open human complaint that the chrome already takes 45% of a 580px
         pane (WATCH #33). A fifth row above the stage would have made a measured, open
         complaint worse by four more lines, so this panel is absolutely positioned inside
         #stage — which has carried `position: relative` since G-030 — and the grid gains
         NO ROW. Every control keeps the distance from the top of the page it had.

         `pointer-events: none` IS LOAD-BEARING, NOT POLISH. The stage is the build
         surface: a click that lands here must reach the canvas underneath, or the panel
         would silently eat the player's drags in the corner it covers. It is a readout
         with no controls in it for exactly that reason, and `r` toggles it. */
      #remarks {
        position: absolute;
        left: 10px;
        bottom: 8px;
        max-width: 54%;
        padding: 5px 8px;
        pointer-events: none;
        background: rgba(20, 24, 31, 0.82);
        border: 1px solid #232833;
        border-radius: 3px;
      }
      /* THE LOSE-STATE WARNING SITS ON THE PICTURE TOO (G-070, ADR-0109, E-013).
         Same argument as the #remarks rule directly above, and it is why the grid gains NO ROW:
         WATCH #38 measured the HUD at 368 of 419 pixels on a 404x419 viewport, with the
         stage collapsing to ZERO. A warning in the chrome would have made a measured,
         open complaint worse; a warning ON the chrome's subject is also more legible than
         the twentieth cell of a wrapping strip.

         TOP-LEFT, opposite corner from #remarks, so the two never overlap at any size.
         `pointer-events: none` for #remarks' reason: the stage is the build surface and a
         click here must reach the canvas underneath.

         IT HAS NO HEIGHT WHEN IT IS EMPTY. `renderSolvency` writes nothing at all when the
         hotel is not losing, and `:empty` takes the border and the padding away with it,
         so a solvent hotel pays ZERO pixels of picture for this surface. */
      #solvency {
        position: absolute;
        left: 10px;
        top: 8px;
        max-width: 54%;
        padding: 5px 8px;
        pointer-events: none;
        background: rgba(46, 18, 20, 0.88);
        border: 1px solid #7a2b30;
        border-radius: 3px;
      }
      #solvency:empty {
        padding: 0;
        border: 0;
      }
      #solvency .sh {
        color: #ff9c9c;
        letter-spacing: 0.08em;
      }
      #solvency .sr {
        color: #f2dcdc;
        margin-top: 2px;
        line-height: 1.3;
      }
      #remarks .rh {
        color: #e8edf5;
      }
      #remarks .rl {
        color: #c8cfda;
        margin-top: 2px;
        /* A long line WRAPS rather than truncating. The punchline is at the end of a guest
           remark, so an ellipsis would cut off the only part worth reading. */
        line-height: 1.3;
      }
      #remarks .rs {
        color: #8f9db0;
      }
      .k {
        color: #6b7787;
      }
      .v {
        color: #e8edf5;
      }
      button {
        font: inherit;
        color: #c8cfda;
        background: #1b212b;
        border: 1px solid #2c3542;
        border-radius: 3px;
        padding: 3px 9px;
        cursor: pointer;
      }
      button:hover {
        background: #222a36;
      }
      button.on {
        background: #2f4a7a;
        border-color: #3f6fb5;
        color: #ffffff;
      }
      /* THE FURNISH PALETTE (G-075c) — the same skin as the buttons beside it, because it is
         a tool picker sitting in a row of tool pickers and a control that looks foreign reads
         as belonging to something else. It is a `select` rather than forty buttons for E-013's
         reason, which `renderTools` states in full: forty controls in this row is the exact
         mechanism WATCH #38 measured collapsing the stage to zero pixels. */
      select {
        font: inherit;
        color: #c8cfda;
        background: #1b212b;
        border: 1px solid #2c3542;
        border-radius: 3px;
        padding: 3px 6px;
        cursor: pointer;
        max-width: 22em;
      }
      select.on {
        background: #2f4a7a;
        border-color: #3f6fb5;
        color: #ffffff;
      }
      button .u {
        color: #8f9db0;
      }
      button.on .u {
        color: #cfe0ff;
      }
      /* The one thing left below the stage, and it is a READOUT rather than a control —
         which is the whole of E-013's lesson: the bottom edge of a page that cannot scroll
         is where you put things the player may lose, never things they must press. */
      #guests {
        padding: 4px 10px;
        color: #6b7787;
        background: #14181f;
        border-top: 1px solid #232833;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- EVERY CONTROL IS IN HERE, AND THAT IS THE RULING (G-048, human: "fine for it to
           be at the top, everything else is"). E-013: `html` and `body` both carry
           `overflow: hidden` and `scrollHeight === innerHeight` at every size, so the page
           NEVER SCROLLS — a control pushed past the bottom edge is not below the fold, it
           is gone, and there is nothing the player can do to get it back. The transport
           row was the last element on the page and its bottom edge WAS the viewport's
           bottom edge, measured flush at `bottom === innerHeight` at every height tested.
           It survived only because #stage yielded; it had zero pixels of margin. -->
      <div>
        <div id="hud"></div>
        <!-- The build tools sit under the HUD: the player reads the cash, picks a room,
             then clicks the building. -->
        <div id="tools"></div>
        <!-- THE SPEED LADDER AND PAUSE, moved here from the foot of the page (G-048).
             Beside the build palette because that is where the human put it and because
             everything else the player presses is already here.

             PAUSE TRAVELS WITH THE RUNGS. §2.1.1 is explicit that pause is "a transport
             state, not a rate" and beneath the ladder — it is drawn apart from the rungs
             inside this row (see `renderTransport`), not banished to a different one.

             NOTHING ABOUT THE LADDER ITSELF MOVED: the rungs are still read from content
             in content order, still labelled `rung.name`, still printed as
             `ticksPerRealSecond`, and the game still opens on the same rung. This goal is
             about REACH, not pace — pace is G-047. -->
        <div id="transport"></div>
        <!-- ONE FLOOR IS DRAWN AT A TIME (HOTELSIM.md §1, ADR-0046), so the switcher is a
             first-class control rather than a corner of the toolbar. It sits directly above
             the stage because it changes what the stage shows and nothing else. -->
        <div id="floors"></div>
      </div>
      <div id="stage">
        <!-- THAT THE HOTEL IS LOSING, AND HOW LONG IT HAS (G-070, ADR-0109). Drawn OVER
             the picture for the reason #remarks is, and in the opposite corner. It is
             EMPTY and costs nothing at all while the hotel is not losing. -->
        <div id="solvency"></div>
        <!-- WHAT RECENT GUESTS SAID (G-066b). Drawn OVER the picture rather than above
             it, so the HUD gains no cells; see the #remarks rule for why that is E-013's
             answer and why it cannot take a pointer event. -->
        <div id="remarks"></div>
      </div>
      <!-- A READOUT, not a control. See the #guests rule above. -->
      <div id="guests"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
